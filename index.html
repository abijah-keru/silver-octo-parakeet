<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Health Record</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3182CE">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <div id="app-shell">
        
        <header id="app-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <img src="assets/logo.png" alt="" style="height: 40px; width: auto; border-radius: 4px;">
                <h1 id="header-title" style="margin: 0; text-transform: capitalize; font-size: 1.25rem;">Home</h1>
            </div>
            
            <div style="display: flex; gap: 8px; color: var(--color-text-secondary);">
                <button aria-label="Search Records" style="background: none; border: none; cursor: pointer; color: inherit; min-height: 48px; min-width: 48px; display: flex; align-items: center; justify-content: center;" onclick="location.hash='#/search'">
                    <i data-lucide="search" style="width: 22px; height: 22px;"></i>
                </button>
                <button aria-label="View Patient Profile" style="background: none; border: none; cursor: pointer; color: inherit; min-height: 48px; min-width: 48px; display: flex; align-items: center; justify-content: center;" onclick="location.hash='#/profile'">
                    <i data-lucide="user" style="width: 22px; height: 22px;"></i>
                </button>
            </div>
        </header>

        <main id="app-root"></main>

        <nav id="bottom-nav">
            <a href="#/" class="nav-item active" data-route="/">
                <i data-lucide="home" style="width: 22px; height: 22px; margin-bottom: 4px;"></i>
                Home
            </a>
            <a href="#/records" class="nav-item" data-route="/records">
                <i data-lucide="clipboard-list" style="width: 22px; height: 22px; margin-bottom: 4px;"></i>
                Records
            </a>
            <a href="#/documents" class="nav-item" data-route="/documents">
                <i data-lucide="folder" style="width: 22px; height: 22px; margin-bottom: 4px;"></i>
                Documents
            </a>
            <a href="#/trends" class="nav-item" data-route="/trends">
                <i data-lucide="line-chart" style="width: 22px; height: 22px; margin-bottom: 4px;"></i>
                Trends
            </a>
            <a href="#/summary" class="nav-item" data-route="/summary">
                <i data-lucide="heart-pulse" style="width: 22px; height: 22px; margin-bottom: 4px;"></i>
                Summary
            </a>
        </nav>

    </div>

    <script type="module" src="js/app.js"></script>

    <script>
        lucide.createIcons();
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
