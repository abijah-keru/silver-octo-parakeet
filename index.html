<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Health Record</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3182CE">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>

    <div id="app-shell">
        
       <!-- Global Header -->
    <!-- Global Header (Cleaned up, no extra SVGs) -->
    <header id="app-header" style="display: flex; align-items: center; justify-content: center; padding: 16px 20px; background: var(--color-surface); position: relative; z-index: 100;">
        <div id="header-title" style="font-weight: 600; font-size: 1.1rem; color: var(--color-text-primary);"></div>
    </header>

        <main id="app-root"></main>

        <nav id="bottom-nav">
            <a href="#/" class="nav-item active" data-route="/">
                <i data-lucide="home" style="width: 22px; height: 22px; margin-bottom: 4px;"></i>
                Home
            </a>
            <a href="#/records" class="nav-item" data-route="/records">
                <i data-lucide="clipboard-list" style="width: 22px; height: 22px; margin-bottom: 4px;"></i>
                Records
            </a>
            <a href="#/documents" class="nav-item" data-route="/documents">
                <i data-lucide="folder" style="width: 22px; height: 22px; margin-bottom: 4px;"></i>
                Documents
            </a>
            <a href="#/trends" class="nav-item" data-route="/trends">
                <i data-lucide="line-chart" style="width: 22px; height: 22px; margin-bottom: 4px;"></i>
                Trends
            </a>
            <a href="#/summary" class="nav-item" data-route="/summary">
                <i data-lucide="heart-pulse" style="width: 22px; height: 22px; margin-bottom: 4px;"></i>
                Summary
            </a>
        </nav>

    </div>

    <script type="module" src="js/app.js"></script>

    <script>
        lucide.createIcons();
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
